<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeadClaw - Sales Pipeline</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦞</text></svg>">
    <style>
        :root {
            --bg: #0d1117;
            --surface: #161b22;
            --border: #30363d;
            --text: #e6edf3;
            --text-muted: #8b949e;
            --accent: #f97316;
            --accent-hover: #fb923c;
            --success: #22c55e;
            --warning: #eab308;
            --danger: #ef4444;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
        
        header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.5rem;
            font-weight: 700;
        }
        
        .logo span { color: var(--accent); }
        
        nav {
            display: flex;
            gap: 1rem;
        }
        
        nav a {
            color: var(--text-muted);
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            transition: all 0.2s;
        }
        
        nav a:hover, nav a.active {
            color: var(--text);
            background: var(--border);
        }
        
        main {
            padding: 2rem;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        
        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
        }
        
        .stat-card h3 {
            color: var(--text-muted);
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }
        
        .stat-card .value {
            font-size: 2rem;
            font-weight: 700;
        }
        
        .stat-card .value.hot { color: var(--danger); }
        .stat-card .value.success { color: var(--success); }
        .stat-card .value.warning { color: var(--warning); }
        
        h2 {
            margin-bottom: 1rem;
            font-size: 1.25rem;
        }
        
        .pipeline {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1rem;
            overflow-x: auto;
        }
        
        .column {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            min-height: 400px;
        }
        
        .column-header {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .column-header h3 {
            font-size: 0.875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .column-header .count {
            background: var(--border);
            padding: 0.25rem 0.75rem;
            border-radius: 999px;
            font-size: 0.75rem;
        }
        
        .column-body {
            padding: 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            max-height: 600px;
            overflow-y: auto;
        }
        
        .lead-card {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .lead-card:hover {
            border-color: var(--accent);
        }
        
        .lead-card .name {
            font-weight: 600;
            margin-bottom: 0.25rem;
        }
        
        .lead-card .company {
            color: var(--text-muted);
            font-size: 0.875rem;
            margin-bottom: 0.5rem;
        }
        
        .lead-card .meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
        }
        
        .score-badge {
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-weight: 600;
        }
        
        .score-badge.cold { background: #1e3a5f; color: #60a5fa; }
        .score-badge.warm { background: #422006; color: #fbbf24; }
        .score-badge.hot { background: #450a0a; color: #f87171; }
        .score-badge.burning { background: #7f1d1d; color: #fca5a5; }
        
        .empty-state {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
        }
        
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4rem;
            color: var(--text-muted);
        }
        
        .error {
            background: #450a0a;
            border: 1px solid #7f1d1d;
            border-radius: 8px;
            padding: 1rem;
            color: #fca5a5;
            margin-bottom: 1rem;
        }
        
        @media (max-width: 768px) {
            header { flex-direction: column; gap: 1rem; }
            main { padding: 1rem; }
            .pipeline { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            🦞 <span>Lead</span>Claw
        </div>
        <nav>
            <a href="#" class="active">Pipeline</a>
            <a href="#stats">Stats</a>
            <a href="#leads">Leads</a>
        </nav>
    </header>
    
    <main>
        <div id="error" class="error" style="display: none;"></div>
        
        <div class="stats-grid" id="stats-grid">
            <div class="stat-card">
                <h3>Total Leads</h3>
                <div class="value" id="stat-total">-</div>
            </div>
            <div class="stat-card">
                <h3>Hot Leads 🔥</h3>
                <div class="value hot" id="stat-hot">-</div>
            </div>
            <div class="stat-card">
                <h3>New This Week</h3>
                <div class="value" id="stat-new">-</div>
            </div>
            <div class="stat-card">
                <h3>Reply Rate</h3>
                <div class="value success" id="stat-reply">-</div>
            </div>
        </div>
        
        <h2>Sales Pipeline</h2>
        <div class="pipeline" id="pipeline">
            <div class="loading">Loading pipeline...</div>
        </div>
    </main>
    
    <script>
        const API_BASE = '/api';
        
        const STATUS_ORDER = ['new', 'contacted', 'engaged', 'qualified', 'hot', 'converted', 'lost'];
        const STATUS_LABELS = {
            new: '📥 New',
            contacted: '📤 Contacted',
            engaged: '💬 Engaged',
            qualified: '✅ Qualified',
            hot: '🔥 Hot',
            converted: '🎉 Converted',
            lost: '❌ Lost'
        };
        
        function getScoreClass(score) {
            if (score >= 75) return 'burning';
            if (score >= 50) return 'hot';
            if (score >= 25) return 'warm';
            return 'cold';
        }
        
        function renderLeadCard(lead) {
            return `
                <div class="lead-card" data-id="${lead.id}">
                    <div class="name">${lead.full_name || lead.email}</div>
                    <div class="company">${lead.company_name || 'Unknown Company'}${lead.job_title ? ' • ' + lead.job_title : ''}</div>
                    <div class="meta">
                        <span>${lead.source || 'manual'}</span>
                        <span class="score-badge ${getScoreClass(lead.score)}">${Math.round(lead.score)}</span>
                    </div>
                </div>
            `;
        }
        
        function renderColumn(status, data) {
            const leads = data?.leads || [];
            return `
                <div class="column" data-status="${status}">
                    <div class="column-header">
                        <h3>${STATUS_LABELS[status] || status}</h3>
                        <span class="count">${leads.length}</span>
                    </div>
                    <div class="column-body">
                        ${leads.length ? leads.map(renderLeadCard).join('') : '<div class="empty-state">No leads</div>'}
                    </div>
                </div>
            `;
        }
        
        async function loadStats() {
            try {
                const res = await fetch(`${API_BASE}/stats`);
                const data = await res.json();
                
                document.getElementById('stat-total').textContent = data.overview?.total_leads ?? '-';
                document.getElementById('stat-hot').textContent = data.overview?.hot_leads ?? '-';
                document.getElementById('stat-new').textContent = data.overview?.new_this_week ?? '-';
                document.getElementById('stat-reply').textContent = (data.overview?.reply_rate ?? '-') + '%';
            } catch (err) {
                console.error('Failed to load stats:', err);
            }
        }
        
        async function loadPipeline() {
            const container = document.getElementById('pipeline');
            
            try {
                const res = await fetch(`${API_BASE}/pipeline`);
                const data = await res.json();
                
                if (data.error) {
                    throw new Error(data.error);
                }
                
                const pipeline = data.pipeline || {};
                
                // Render columns in order
                const visibleStatuses = STATUS_ORDER.filter(s => s !== 'lost' && s !== 'converted');
                container.innerHTML = visibleStatuses.map(status => 
                    renderColumn(status, pipeline[status])
                ).join('');
                
            } catch (err) {
                console.error('Failed to load pipeline:', err);
                const errorEl = document.getElementById('error');
                errorEl.textContent = `Failed to load pipeline: ${err.message}. Make sure the API is running and DATABASE_URL is configured.`;
                errorEl.style.display = 'block';
                container.innerHTML = '<div class="empty-state">Unable to load pipeline</div>';
            }
        }
        
        // Load data on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadStats();
            loadPipeline();
            
            // Refresh every 30 seconds
            setInterval(() => {
                loadStats();
                loadPipeline();
            }, 30000);
        });
    </script>
</body>
</html>
